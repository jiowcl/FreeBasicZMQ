name: FreeBASIC CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  PKG: FreeBasicZMQ
  FBC_VERSION: "1.10.1"

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make libncurses5 libffi-dev libzmq3-dev curl

      - name: Install FreeBASIC (Linux)
        if: runner.os == 'Linux'
        run: |
          URL="https://sourceforge.net/projects/fbc/files/FreeBASIC-${FBC_VERSION}/Binaries-Linux/FreeBASIC-${FBC_VERSION}-ubuntu-22.04-x86_64.tar.gz/download"
          curl -s -L "$URL" | tar -xz
          cd "FreeBASIC-${FBC_VERSION}-ubuntu-22.04-x86_64"
          sudo ./install.sh -i
          fbc -version

      - name: Install FreeBASIC (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = "${{ env.FBC_VERSION }}"
          $url = "https://downloads.sourceforge.net/project/fbc/FreeBASIC-$ver/Binaries-Windows/FreeBASIC-$ver-win64.zip"
          $zip = "$env:RUNNER_TEMP\fbc-win64.zip"
          $root = "$env:RUNNER_TEMP\fbc-root"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          curl.exe -fSL $url -o $zip
          $size = (Get-Item $zip).Length
          if ($size -lt 5MB) {
            throw "Download too small ($size bytes); SourceForge may have returned an error page"
          }
          $magic = [System.IO.File]::ReadAllBytes($zip)[0..1]
          if ($magic[0] -ne 0x50 -or $magic[1] -ne 0x4B) {
            throw "Not a ZIP archive (bad magic bytes)"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $fbc = Get-ChildItem -Path $root -Recurse -Filter fbc.exe | Select-Object -First 1
          if (-not $fbc) { throw "fbc.exe not found under $root" }
          Add-Content -Path $env:GITHUB_PATH -Value $fbc.DirectoryName
          "FBC=$($fbc.FullName)" | Add-Content -Path $env:GITHUB_ENV
          & $fbc.FullName -version

      - name: Compile example set (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd "${{ env.PKG }}"
          mkdir -p build
          for src in Example/Zmq.bas Example/Has.bas Example/Z85.bas Example/Poll.bas; do
            echo "Compiling $src ..."
            fbc -w all "$src" -x "build/$(basename "$src" .bas)"
          done

      - name: Compile example set (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-Location "${{ env.PKG }}"
          New-Item -ItemType Directory -Force -Path build | Out-Null
          foreach ($src in @("Example\Zmq.bas", "Example\Has.bas", "Example\Z85.bas", "Example\Poll.bas")) {
            Write-Host "Compiling $src ..."
            $out = "build\" + [IO.Path]::GetFileNameWithoutExtension($src) + ".exe"
            & $env:FBC -w all $src -x $out
          }

      - name: Build and run CiSmoke (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd "${{ env.PKG }}"
          fbc -w all Example/CiSmoke.bas -x CiSmoke
          ./CiSmoke

      - name: Build and run CiSmoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Set-Location "${{ env.PKG }}"
          & $env:FBC -w all Example\CiSmoke.bas -x CiSmoke.exe
          .\CiSmoke.exe